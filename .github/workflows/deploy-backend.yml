name: Deploy Backend to EC2

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            # Self-heal the checkout so a plain merge can never abort the deploy on
            # "untracked working tree files would be overwritten by merge". Force the
            # working tree to exactly match origin/main before building.
            REPO_DIR="${DEPLOY_REPO_DIR:-$HOME/same_day_Solution_1}"
            if [ ! -d "$REPO_DIR/.git" ]; then
              REPO_DIR="$(dirname "$(find "$HOME" -maxdepth 3 -type d -name .git 2>/dev/null | head -n1)")"
            fi
            echo "Using REPO_DIR=$REPO_DIR"
            cd "$REPO_DIR"
            git clean -fd
            git fetch origin main
            git reset --hard origin/main
            # Keep the server deploy script in sync with the version-controlled one.
            if [ -f scripts/deploy.sh ]; then
              cp -f scripts/deploy.sh ~/deploy.sh
              chmod +x ~/deploy.sh
            fi
            bash ~/deploy.sh
            echo "Waiting for backend to boot..."
            for i in $(seq 1 10); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health || true)
              if [ "$code" = "200" ]; then
                echo "Health check OK (HTTP 200) after ${i} attempt(s)"
                exit 0
              fi
              echo "Attempt ${i}: got HTTP ${code}, retrying in 3s..."
              sleep 3
            done
            echo "HEALTH CHECK FAILED — backend not returning 200 on /api/health"
            pm2 logs sameday-backend --lines 40 --nostream || true
            exit 1

      - name: Notify Slack (success)
        if: success()
        run: |
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":white_check_mark: *Backend deployed* to EC2\n*Repo:* ${GITHUB_REPOSITORY}\n*Commit:* \`${GITHUB_SHA:0:7}\` by ${GITHUB_ACTOR}\n*Run:* ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Notify Slack (failure)
        if: failure()
        run: |
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":x: *Backend deploy FAILED* on EC2\n*Repo:* ${GITHUB_REPOSITORY}\n*Commit:* \`${GITHUB_SHA:0:7}\` by ${GITHUB_ACTOR}\n*Check logs:* ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
